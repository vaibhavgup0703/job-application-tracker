# Render Blueprint: Render reads this file and creates the service for you.
# Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Only the .NET API runs on Render. The Angular frontend runs on Vercel (see frontend-angular/vercel.json).
services:
  - type: web
    name: jobtracker-api
    runtime: docker
    plan: free
    region: singapore                         # closest Render region to India
    dockerContext: ./backend-dotnet
    dockerfilePath: ./backend-dotnet/Dockerfile
    healthCheckPath: /health                  # Render calls this to know the app started
    autoDeploy: true                          # every push to main redeploys
    envVars:
      - key: Jwt__Key                         # "__" = nesting, i.e. Jwt:Key in appsettings.json
        generateValue: true                   # Render creates a random secret for you
      - key: Demo__Enabled
        value: "true"                         # seed the demo account on every start
      - key: Cors__AllowedOrigin
        sync: false                           # you paste your Vercel URL here after deploying the frontend
