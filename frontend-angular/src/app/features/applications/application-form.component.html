<div class="page-head">
  <h1>{{ isEdit() ? 'Edit application' : 'New application' }}</h1>
  <a class="btn btn-ghost" routerLink="/applications">Cancel</a>
</div>

@if (error()) { <p class="alert">{{ error() }}</p> }

<form class="card form-grid" [formGroup]="form" (ngSubmit)="submit()">
  <label>Company *
    <input formControlName="company" />
    @if (invalid('company')) { <small class="field-error">Company is required (max 100).</small> }
    @if (serverErrors()['company']) { <small class="field-error">{{ serverErrors()['company'] }}</small> }
  </label>

  <label>Role *
    <input formControlName="role" />
    @if (invalid('role')) { <small class="field-error">Role is required (max 100).</small> }
    @if (serverErrors()['role']) { <small class="field-error">{{ serverErrors()['role'] }}</small> }
  </label>

  <label>Status
    <select formControlName="status">
      @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
    </select>
  </label>

  <label>Applied on
    <input type="date" formControlName="appliedOn" />
    @if (serverErrors()['appliedOn']) { <small class="field-error">{{ serverErrors()['appliedOn'] }}</small> }
  </label>

  <label>Location
    <input formControlName="location" placeholder="e.g. Noida / Remote" />
  </label>

  <label>Salary (LPA)
    <input type="number" step="0.1" formControlName="salaryLpa" />
    @if (invalid('salaryLpa')) { <small class="field-error">Between 0 and 1000.</small> }
  </label>

  <label class="full">Job URL
    <input formControlName="jobUrl" placeholder="https://…" />
    @if (invalid('jobUrl')) { <small class="field-error">Must start with http:// or https://</small> }
    @if (serverErrors()['jobUrl']) { <small class="field-error">{{ serverErrors()['jobUrl'] }}</small> }
  </label>

  <label class="full">Notes
    <textarea rows="4" formControlName="notes" placeholder="Interview rounds, contacts, follow-ups…"></textarea>
  </label>

  <div class="full form-actions">
    <button class="btn btn-primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving…' : isEdit() ? 'Save changes' : 'Add application' }}
    </button>
  </div>
</form>
